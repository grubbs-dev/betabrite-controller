[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "betabrite-controller"
dynamic = ["version"]
description = "Cross-platform controller core for classic Alpha/BetaBrite LED signs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Grubbs" }
]
dependencies = [
  "alphasignpy==0.1.1",
  "pyserial>=3.5,<4",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.10,<7",
]

[project.urls]
Homepage = "https://github.com/grubbs-dev/betabrite-controller"
Repository = "https://github.com/grubbs-dev/betabrite-controller"
Issues = "https://github.com/grubbs-dev/betabrite-controller/issues"

[project.scripts]
betabrite = "betabrite_controller.cli:main"

[project.gui-scripts]
betabrite-desktop = "betabrite_controller.desktop_launcher:main"

[tool.setuptools]
packages = ["betabrite_controller", "betabrite_controller.assets", "betabrite_controller.assets.licenses"]

[tool.setuptools.dynamic]
version = {attr = "betabrite_controller.__version__"}

[tool.setuptools.package-data]
betabrite_controller = ["assets/*.png", "assets/licenses/*.txt"]
