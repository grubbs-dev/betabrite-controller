name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: python -m pip install .

      - name: Compile Python sources
        run: |
          python -m compileall -q betabrite_controller tests
          python -m py_compile betabrite betabrite-gui

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Smoke-test CLI
        run: |
          betabrite --version
          betabrite --list-ports

  linux-integration:
    name: Linux installer syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh test.sh scripts/build-release.sh


  package:
    name: Package artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Smoke-test packaged CLI
        run: |
          betabrite --version
          betabrite --list-ports

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz
