name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: python -m pip install .

      - name: Compile Python sources
        run: |
          python -m compileall -q betabrite_controller tests
          python -m py_compile betabrite betabrite-gui

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Smoke-test CLI
        run: |
          betabrite --version
          betabrite --list-ports

  linux-integration:
    name: Linux installer syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check shell syntax
        run: |
          bash -n install.sh uninstall.sh test.sh scripts/build-release.sh \
            packaging/linux/AppRun packaging/linux/install-desktop.sh \
            packaging/linux/uninstall-desktop.sh


  package:
    name: Package artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine "Pillow==12.3.0"

      - name: Verify generated application branding
        run: python scripts/generate-icons.py --check

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Smoke-test packaged CLI
        run: |
          betabrite --version
          betabrite --list-ports

      - name: Verify packaged application icon
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c "from betabrite_controller.branding import application_icon_path; assert application_icon_path().is_file()"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz

  desktop:
    name: Portable desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install portable desktop
        run: python -m pip install ".[desktop]"

      - name: Smoke-test portable desktop
        run: betabrite-desktop --smoke-test
