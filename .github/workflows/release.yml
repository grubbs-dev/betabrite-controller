name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate sources
        run: |
          bash -n install.sh uninstall.sh test.sh scripts/build-release.sh
          python -m py_compile betabrite betabrite-gui betabrite_controller/*.py tests/*.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build release archives
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "BetaBrite Controller ${GITHUB_REF_NAME}"
