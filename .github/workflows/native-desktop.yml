name: Native Desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64:
        required: false
      WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD:
        required: false
      MACOS_DEVELOPER_ID_CERTIFICATE_BASE64:
        required: false
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false
      APPLE_NOTARY_PRIVATE_KEY_BASE64:
        required: false

permissions:
  contents: read

jobs:
  build-native:
    name: Native desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache native compiler data
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/Nuitka
            ~/Library/Caches/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/.cache/ccache
            ~/Library/Caches/ccache
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'scripts/build-native.py') }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux deployment dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache patchelf

      - name: Install macOS compiler cache
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop]"

      - name: Label unsigned desktop artifacts
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
        run: |
          suffix=""
          if [[ "${RUNNER_OS}" == "Windows" && ( "${GITHUB_EVENT_NAME}" == "pull_request" || -z "$WINDOWS_CERTIFICATE" ) ]]; then
            suffix="-unsigned"
          elif [[ "${RUNNER_OS}" == "macOS" && ( "${GITHUB_EVENT_NAME}" == "pull_request" || -z "$MACOS_CERTIFICATE" ) ]]; then
            suffix="-unsigned"
          fi
          echo "BETABRITE_ARTIFACT_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "ARTIFACT_SUFFIX=$suffix" >> "$GITHUB_ENV"

      - name: Prepare optional macOS signing and notarization
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" ]]; then
            echo "macOS signing credentials are absent; building an ad-hoc-signed artifact."
            exit 0
          fi
          if [[ -z "$CERTIFICATE_PASSWORD" || -z "$SIGNING_IDENTITY" ]]; then
            echo "The macOS certificate password and signing identity are required when a certificate is configured." >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/betabrite-build.keychain-db"
          keychain_password="$(uuidgen)"
          CERTIFICATE_PATH="$certificate_path" python -c 'import base64, os, pathlib; pathlib.Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["CERTIFICATE_BASE64"]))'
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          notary_key_path=""
          if [[ -n "$NOTARY_PRIVATE_KEY_BASE64" || -n "$NOTARY_KEY_ID" || -n "$NOTARY_ISSUER_ID" ]]; then
            if [[ -z "$NOTARY_PRIVATE_KEY_BASE64" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
              echo "All three Apple notarization secrets must be configured together." >&2
              exit 1
            fi
            notary_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
            NOTARY_KEY_PATH="$notary_key_path" python -c 'import base64, os, pathlib; pathlib.Path(os.environ["NOTARY_KEY_PATH"]).write_bytes(base64.b64decode(os.environ["NOTARY_PRIVATE_KEY_BASE64"]))'
          fi

          {
            echo "MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            if [[ -n "$notary_key_path" ]]; then
              echo "APPLE_NOTARY_PRIVATE_KEY_PATH=$notary_key_path"
              echo "APPLE_NOTARY_KEY_ID=$NOTARY_KEY_ID"
              echo "APPLE_NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
            fi
          } >> "$GITHUB_ENV"

      - name: Dry-run native deployment
        run: python scripts/build-native.py --dry-run

      - name: Build and smoke-test native desktop artifact
        run: python scripts/build-native.py

      - name: Sign and refresh Windows portable package when configured
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) {
            Write-Host "Windows signing credentials are absent; keeping unsigned artifacts."
            exit 0
          }
          if (-not $env:CERTIFICATE_PASSWORD) {
            throw "The Windows certificate password is required when a certificate is configured."
          }

          $certificate = Join-Path $env:RUNNER_TEMP "betabrite-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found." }

          $app = Get-ChildItem "dist/native/betabrite-controller-*-windows-x86_64*.exe" |
            Where-Object { $_.Name -notmatch "-setup" } |
            Select-Object -First 1
          & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:CERTIFICATE_PASSWORD $app.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $archive = Get-ChildItem "dist/native/betabrite-controller-*-windows-x86_64*.zip" | Select-Object -First 1
          $staging = Join-Path $env:RUNNER_TEMP "betabrite-portable"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item $app.FullName (Join-Path $staging "BetaBriteController.exe") -Force
          Compress-Archive -Path (Join-Path $staging "BetaBriteController.exe") -DestinationPath $archive.FullName -Force

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $version = python -c "from betabrite_controller import __version__; print(__version__)"
          $app = Get-ChildItem "dist/native/betabrite-controller-*-windows-x86_64*.exe" |
            Where-Object { $_.Name -notmatch "-setup" } |
            Select-Object -First 1
          if (-not $app) { throw "Native Windows executable not found." }
          $output = (Resolve-Path "dist/native").Path
          $icon = (Resolve-Path "assets/betabrite-controller.ico").Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DAppVersion=$version" `
            "/DAppExe=$($app.FullName)" `
            "/DAppIcon=$icon" `
            "/DArtifactSuffix=$env:ARTIFACT_SUFFIX" `
            "/DOutputDir=$output" `
            "packaging/windows/betabrite-controller.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign Windows installer when configured
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) { exit 0 }
          $certificate = Join-Path $env:RUNNER_TEMP "betabrite-signing.pfx"
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          $installer = Get-ChildItem "dist/native/betabrite-controller-*-windows-x86_64*-setup.exe" | Select-Object -First 1
          & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:CERTIFICATE_PASSWORD $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Refresh Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $checksum = "dist/native/SHA256SUMS-windows"
          $files = Get-ChildItem "dist/native" -File |
            Where-Object { $_.Name -ne "SHA256SUMS-windows" } |
            Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          Set-Content -Path $checksum -Value $lines -Encoding ascii

      - name: Validate packaged Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="$(find dist/native -maxdepth 1 -name '*-linux-*.tar.gz' -print -quit)"
          mkdir -p build/linux-package-check
          tar -xzf "$package" -C build/linux-package-check
          bash -n build/linux-package-check/BetaBriteController/AppRun \
            build/linux-package-check/BetaBriteController/install-desktop.sh \
            build/linux-package-check/BetaBriteController/uninstall-desktop.sh
          QT_QPA_PLATFORM=offscreen build/linux-package-check/BetaBriteController/AppRun --smoke-test

      - name: Validate packaged Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem "dist/native/betabrite-controller-*-windows-x86_64*.zip" | Select-Object -First 1
          $destination = "build/windows-package-check"
          Expand-Archive $archive.FullName -DestinationPath $destination -Force
          & "$destination/BetaBriteController.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem "dist/native/*-setup.exe")) { throw "Windows installer not found." }

      - name: Validate packaged macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archive="$(find dist/native -maxdepth 1 -name '*-macos-*.zip' -print -quit)"
          mkdir -p build/macos-package-check
          ditto -x -k "$archive" build/macos-package-check
          app="build/macos-package-check/BetaBrite Controller.app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "dev.grubbs.BetaBriteController"
          QT_QPA_PLATFORM=offscreen "$app/Contents/MacOS/$executable" --smoke-test
          test -f dist/native/*.dmg

      - name: List native artifacts
        shell: bash
        run: |
          ls -lah dist/native
          cat dist/native/SHA256SUMS-*

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: dist/native/*
          if-no-files-found: error
